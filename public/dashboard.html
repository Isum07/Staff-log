<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Leave Management - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
        <div class="nav-brand">
            <h2>📋 Leave Management System</h2>
        </div>
        <div class="nav-user">
            <span id="userName"></span>
            <span class="role-badge" id="userRole"></span>
            <button id="logoutBtn" class="btn btn-secondary btn-sm">🚪 Logout</button>
        </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <div>
                <h1>📊 Dashboard</h1>
                <p style="color: var(--text-secondary); margin-top: 8px; font-size: 14px;">Manage your leave requests efficiently</p>
            </div>
            <button id="applyLeaveBtn" class="btn btn-primary" style="display: none;">➕ Apply for Leave</button>
        </div>

        <!-- Leave Application Modal -->
        <div id="leaveModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>📝 Apply for Leave</h2>
                    <span class="close">&times;</span>
                </div>
                <form id="leaveForm" class="modal-body">
                    <div class="form-group">
                        <label for="leave_type">🏷️ Leave Type <span class="required">*</span></label>
                        <select id="leave_type" name="leave_type" required>
                            <option value="">Select Leave Type</option>
                            <option value="medical">🏥 Medical Leave</option>
                            <option value="casual">🎯 Casual Leave</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="start_date">📅 Start Date <span class="required">*</span></label>
                        <input type="date" id="start_date" name="start_date" required>
                    </div>
                    <div class="form-group">
                        <label for="end_date">📅 End Date <span class="required">*</span></label>
                        <input type="date" id="end_date" name="end_date" required>
                    </div>
                    <div class="form-group">
                        <label for="reason">📄 Reason <span class="required">*</span></label>
                        <textarea id="reason" name="reason" rows="4" required placeholder="Please provide a detailed reason for your leave request"></textarea>
                    </div>
                    <div class="form-group" id="documentGroup" style="display: none;">
                        <label for="document">📎 Medical Document <span class="required">*</span> <span class="file-info">(PDF, JPG, PNG - Max 5MB)</span></label>
                        <input type="file" id="document" name="document" accept=".pdf,.jpg,.jpeg,.png">
                    </div>
                    <div id="formErrorMessage" class="error-message"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelBtn">❌ Cancel</button>
                        <button type="submit" class="btn btn-primary">✅ Submit Request</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Leave Requests Table -->
        <div class="card">
            <div class="card-header">
                <h2 id="tableTitle">📋 Leave Requests</h2>
                <button id="refreshBtn" class="btn btn-secondary btn-sm">🔄 Refresh</button>
            </div>
            <div class="card-body">
                <div id="loadingIndicator" class="loading">Loading...</div>
                <div id="noDataMessage" class="no-data" style="display: none;">No leave requests found</div>
                <table id="leaveTable" class="data-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Teacher</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Applied On</th>
                            <th id="adminActionsHeader" style="display: none;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leaveTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
