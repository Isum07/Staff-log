<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Leave Management - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🍃</div>
                <h1>Teacher Leave Management</h1>
                <p>Sign in to your account</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">👤 Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">🔒 Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn btn-primary btn-block btn-no-arrow">Sign In</button>
            </form>
            <div class="login-footer">
                <p>Default credentials: admin/admin123 or teacher1/teacher123</p>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
